<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mini Donuts  Dessert</title>

    <link rel="stylesheet"
          href="style.css">
</head>
<body>
<header>

    <img src="logo.png" width="5%" height="5%">

    <nav>
        <a href="home.html">Home</a>
        <a href="product.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
        
    </nav>

</header>


<div class="page-title">

    <h1>Checkout</h1>

    <p>Complete your order information.</p>

</div>
<section class="form-box">

    <form action="review.html">

        <label>
            Full Name
        </label>

        <input type="text"
               placeholder="Enter your full name"
               required>

        <label>
            Email
        </label>

        <input type="email"
               placeholder="Enter your email"
               required>

        <label>
            Contact Number
        </label>

        <input type="tel"
               placeholder="09XXXXXXXXX"
               required>


        <label>
            Delivery Address
        </label>

        <textarea
            placeholder="Enter your complete address"
            required></textarea>

        <label>
            Payment Method
        </label>

        <select required>

            <option value="">
                Select payment method
            </option>

            <option>
                Cash on Delivery
            </option>

            <option>
                GCash
            </option>

            <option>
                Bank Transfer
            </option>

        </select>


        <label>
            Order Notes
        </label>

        <textarea
            placeholder="Optional notes">
        </textarea>
        <button type="submit"
                class="button">

            PLACE ORDER

        </button>

    </form>
</section>
<footer>

    <p>
        © 2026 Mini Donuts  Dessert
    </p>

</footer>

</body>
</html>

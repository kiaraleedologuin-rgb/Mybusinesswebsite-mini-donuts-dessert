<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title> Mini Donuts  Dessert</title>
    <link rel="stylesheet"
          href="style.css">
</head>
<body>
<header>

   <img src="logo.png" width="5%" height="5%">
    
</header>

<div class="page-title">
    <h1>Customer Reviews</h1>
    <p>What our customers say</p>
</div>

<section class="reviews">

    <div class="review-card">

        <h2>Maria</h2>

        <p>
            "The mini donuts are delicious
            and very cute!"
        </p>

    </div>


    <div class="review-card">

        <h2>John </h2>

        <p>
            "I love the chocolate and
            strawberry flavors."
        </p>

    </div>


    <div class="review-card">

        <h2>Anne </h2>

        <p>
            "Perfect dessert for sharing
            with friends."
        </p>

    </div>

</section>


<section class="form-box">

    <h2>Leave a Review</h2>

    <form action="review.html">

        <label>Your Name</label>

        <input type="text"
               placeholder="Enter your name"
               required>

        <label>Your Review</label>

        <textarea
            placeholder="Write your review"
            required></textarea>

    
                <a href="about.html"
           class="button">
            SUMBIT
        </a>

    </form>

</section>


<footer>

    <p>
        © 2026 Mini Donuts Dessert
    </p>

</footer>

</body>
</html>
